name: HabitForge Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -v

      - name: Run coverage
        run: >
          python -m pytest
          --cov=models
          --cov=repository
          --cov=fixtures
          --cov=analytics
          --cov=main
          --cov-report=term
          